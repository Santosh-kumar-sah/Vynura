  <path d="M42 22C38 20 31 22 28 27C24.5 32.5 26 39 30 43C34 47 41 47 45 44C36 47 28 41 29 33C30 26 36 22.5 42 22Z" fill="#FFC978" filter="url(#glow)" opacity="0.95" />
